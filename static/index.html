<html>

<head>
  <meta name="viewport" content="width=device-width">
  <title>Woodworking Tycoon</title>
  <!-- Every font is served from this origin; there is no font CDN to
       preconnect to. They're vendored by `npm run fetch:fonts` (see
       scripts/fetch-fonts.ts) and declared in styles/fonts.generated.css.

       The workhorse face the page is set in starts alongside the bundle
       rather than waiting for the stylesheet to be parsed and a glyph to
       ask for it; the rest are fetched by loadFonts() behind the boot
       gate. Fonts are fetched in CORS mode even from our own origin, so
       `crossorigin` is required here — without it the preload is wasted
       and the file loads twice. -->
  <link rel="preload" href="/fonts/barlow-condensed-400.woff2" as="font" type="font/woff2" crossorigin>
  <!-- The painted sign is the first thing drawn, in the start menu's first
       render, so it's fetched alongside the bundle rather than after it. -->
  <link rel="preload" href="/images/main-title-logo.png" as="image">
  <link rel="stylesheet" href="/styles/index.css" />
  <link rel="icon" href="/images/favicon.png" />
  <style>
    html {
      background: #1f1c18;
    }

    body {
      margin: 0;
      overflow: hidden;
    }

    /* The boot placeholder: on screen from first paint until assets and
       fonts are in and the shell removes it, so it depends on nothing the
       bundle loads — colors inlined from tailwind.config.ts, face the one
       weight the <link> above preloads. */
    #boot-loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1f1c18;
      color: #e6d5a8;
      font: 400 20px "Barlow Condensed", sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      animation: boot-breathe 1.6s ease-in-out infinite;
    }

    @keyframes boot-breathe {
      50% {
        opacity: 0.35;
      }
    }
  </style>
</head>

<body>
  <div id="boot-loading">Opening the shop&hellip;</div>
  <script src="/engine-main.js"></script>
</body>

</html>
